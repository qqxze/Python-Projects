name: V9 strict backtest

on:
  pull_request:
    paths:
      - 'v9_backtest/**'
      - '.github/workflows/v9_backtest.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pandas
      - name: Download frozen public data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v9_backtest/data
          base='https://raw.githubusercontent.com/bumbeishvili/tqqq.networthcast.com/main/data'
          for f in synthetic-qqq.tsv spy.tsv synthetic-qld.tsv synthetic-sso.tsv synthetic-tqqq.tsv short-rates.tsv; do
            curl -fL --retry 3 "$base/$f" -o "v9_backtest/data/$f"
          done
          curl -fL --retry 3 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=BAMLH0A0HYM2' -o v9_backtest/data/hy_oas.csv
          wc -l v9_backtest/data/*.tsv v9_backtest/data/hy_oas.csv
      - name: Run frozen V9 baseline
        working-directory: v9_backtest
        run: python run_formal_backtest.py
      - name: Run V10 research factorial experiments
        working-directory: v9_backtest
        run: python run_v10_research_experiments.py
      - name: Show research results
        working-directory: v9_backtest
        run: |
          cat v10_research_results/summary.csv
          cat v10_research_results/diagnostics.json
          cat v10_research_results/rolling.json
          cat v10_research_results/eras.csv
      - name: Upload V10 research artifact
        uses: actions/upload-artifact@v4
        with:
          name: v10-factor-research-results
          path: |
            v9_backtest/results/
            v9_backtest/v10_research_results/
          if-no-files-found: error
          retention-days: 7
