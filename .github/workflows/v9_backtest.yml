name: V9 strict backtest

on:
  pull_request:
    paths:
      - 'v9_backtest/**'
      - '.github/workflows/v9_backtest.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pandas
      - name: Download frozen public data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v9_backtest/data
          base='https://raw.githubusercontent.com/bumbeishvili/tqqq.networthcast.com/main/data'
          for f in synthetic-qqq.tsv spy.tsv synthetic-qld.tsv synthetic-sso.tsv synthetic-tqqq.tsv short-rates.tsv; do
            curl -fL --retry 3 "$base/$f" -o "v9_backtest/data/$f"
          done
          wc -l v9_backtest/data/*.tsv
      - name: Run frozen V9 2000-2025
        working-directory: v9_backtest
        run: python run_formal_backtest.py
      - name: Run production execution variants
        working-directory: v9_backtest
        run: python run_execution_backtest.py
      - name: Run true split-sleeve production model
        working-directory: v9_backtest
        run: python run_split_sleeve_backtest.py
      - name: Run fixed-flow QQQ frontier
        working-directory: v9_backtest
        run: python run_flow_frontier.py
      - name: Run original V9 dynamic-flow reconstruction
        working-directory: v9_backtest
        run: python run_v9_original_dynamic_flow.py
      - name: Show results
        working-directory: v9_backtest
        run: |
          echo '=== strict target-weight ==='
          cat results/summary.csv
          echo '=== true split sleeve ==='
          cat split_results/summary.csv
          echo '=== original V9 dynamic flow ==='
          cat v9_original_dynamic_results/spec.json
          cat v9_original_dynamic_results/summary.csv
          cat v9_original_dynamic_results/crisis_stats.json
      - name: Upload backtest artifact
        uses: actions/upload-artifact@v4
        with:
          name: v9-original-dynamic-flow-results
          path: |
            v9_backtest/results/
            v9_backtest/execution_results/
            v9_backtest/split_results/
            v9_backtest/frontier_results/
            v9_backtest/v9_original_dynamic_results/
          if-no-files-found: error
          retention-days: 7
