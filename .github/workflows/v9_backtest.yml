name: V9 strict backtest

on:
  pull_request:
    paths:
      - 'v9_backtest/**'
      - '.github/workflows/v9_backtest.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal FinRL-X runtime
        run: |
          pip install --disable-pip-version-check \
            numpy pandas scipy matplotlib yfinance pandas-market-calendars requests 'bt>=1.2.0'
      - name: Clone pinned official FinRL-X
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/AI4Finance-Foundation/FinRL-Trading.git /tmp/FinRL-Trading
          cd /tmp/FinRL-Trading
          git checkout e65d6f0483ead7d2ef4a5fc940cdf960392a25c1
          test "$(git rev-parse HEAD)" = "e65d6f0483ead7d2ef4a5fc940cdf960392a25c1"
      - name: Download pinned HY OAS history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v9_backtest/data
          curl -fL --retry 3 'https://raw.githubusercontent.com/maaurocp/Trading_Protocol/bf64e83fa4c2a6e72c37d3883476dc81bd9d2e31/data/raw/fred_BAMLH0A0HYM2.csv' -o v9_backtest/data/hy_oas_full.csv
          test "$(wc -l < v9_backtest/data/hy_oas_full.csv)" -gt 7000
      - name: Run official FinRL-X real-data validation
        working-directory: v9_backtest
        env:
          FINRL_X_ROOT: /tmp/FinRL-Trading
        run: python run_finrl_real_validation_entry.py
      - name: Show real-data results
        working-directory: v9_backtest
        run: |
          echo '=== Official FinRL-X unitized ==='
          cat finrl_real_validation/finrl_unitized_summary.csv
          echo '=== Real-data DCA ==='
          cat finrl_real_validation/dca_summary.csv
          echo '=== Data audit ==='
          cat finrl_real_validation/data_audit.json
      - name: Upload real-data artifact
        uses: actions/upload-artifact@v4
        with:
          name: v9-finrl-real-data-validation
          path: v9_backtest/finrl_real_validation/
          if-no-files-found: error
          retention-days: 7
