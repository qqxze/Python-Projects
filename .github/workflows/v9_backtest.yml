name: V9 strict backtest

on:
  pull_request:
    paths:
      - 'v9_backtest/**'
      - '.github/workflows/v9_backtest.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pandas
      - name: Download frozen public data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v9_backtest/data
          base='https://raw.githubusercontent.com/bumbeishvili/tqqq.networthcast.com/main/data'
          for f in synthetic-qqq.tsv spy.tsv synthetic-qld.tsv synthetic-sso.tsv synthetic-tqqq.tsv short-rates.tsv; do
            curl -fL --retry 3 "$base/$f" -o "v9_backtest/data/$f"
          done
          curl -fL --retry 3 'https://raw.githubusercontent.com/maaurocp/Trading_Protocol/bf64e83fa4c2a6e72c37d3883476dc81bd9d2e31/data/raw/fred_BAMLH0A0HYM2.csv' -o v9_backtest/data/hy_oas_full.csv
          test "$(wc -l < v9_backtest/data/hy_oas_full.csv)" -gt 7000
      - name: Run credit gate sensitivity
        working-directory: v9_backtest
        run: python run_credit_gate_sensitivity.py
      - name: Show sensitivity results
        working-directory: v9_backtest
        run: |
          cat credit_gate_sensitivity/sensitivity.csv
          cat credit_gate_sensitivity/diagnostics.json
      - name: Upload sensitivity artifact
        uses: actions/upload-artifact@v4
        with:
          name: v10-credit-gate-sensitivity
          path: v9_backtest/credit_gate_sensitivity/
          if-no-files-found: error
          retention-days: 7
